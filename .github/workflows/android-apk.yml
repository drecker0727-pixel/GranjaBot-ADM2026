name: GranjaBot ADM - Gerar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar estrutura
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          find app/src/main -type f | sort

      - name: Preparar ícone do galo ADM
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/icon_rooster.png.base64 > app/src/main/res/drawable-nodpi/granjabot_rooster.png
          file app/src/main/res/drawable-nodpi/granjabot_rooster.png

      - name: Compilar APK e mostrar erros
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GranjaBot-ADM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
